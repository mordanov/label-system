name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # needed for creating releases

env:
  APK_PATH: android/app/build/outputs/apk/debug/app-debug.apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: label-app-${{ github.sha }}
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Deploy APK to VPS
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_DIR: ${{ secrets.VPS_WEB_FOLDERS_DIR }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p $DEPLOY_DIR/apk"
          scp "$APK_PATH" "$VPS_USER@$VPS_HOST:$DEPLOY_DIR/apk/label-app.apk"
          echo '{"version_code":${{ github.run_number }}}' > version.json
          scp version.json "$VPS_USER@$VPS_HOST:$DEPLOY_DIR/apk/version.json"
          ssh "$VPS_USER@$VPS_HOST" "
            docker exec web-folders-label-system-backend-1 mkdir -p /app/apk 2>/dev/null || true
            docker cp $DEPLOY_DIR/apk/label-app.apk web-folders-label-system-backend-1:/app/apk/label-app.apk 2>/dev/null || true
            docker cp $DEPLOY_DIR/apk/version.json web-folders-label-system-backend-1:/app/apk/version.json 2>/dev/null || true
          "

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
